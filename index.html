*{box-sizing:border-box;margin:0;padding:0}
body{color-scheme:light;background:#f2e9d8;color:#2b2a26;font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#b5790a;margin-bottom:6px;text-align:center}

.filter-bar{display:flex;align-items:center;gap:10px;width:100%;max-width:360px;margin-bottom:14px}
.filter-bar .flabel{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8a7f6b;flex-shrink:0}
.filter-bar select{flex:1;background:#fffdf8;border:1.5px solid rgba(0,0,0,0.14);border-radius:8px;padding:9px 10px;color:#2b2a26;font-family:'DM Mono',monospace;font-size:12px;outline:none}
.filter-bar select:focus{border-color:#b5790a}
.abs-btn{display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;background:#fffdf8;border:1.5px solid #c0392b;border-radius:8px;padding:8px 12px;color:#c0392b;text-decoration:none;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.5px;text-transform:uppercase;transition:background .15s,color .15s}
.abs-btn svg{width:15px;height:15px;flex-shrink:0}
.abs-btn:hover,.abs-btn:active{background:#c0392b;color:#f2e9d8}
.abs-btn:hover svg,.abs-btn:active svg{stroke:#f2e9d8}
.list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.row{display:flex;align-items:stretch;gap:8px}
.row.filtered-out{display:none}
.centre{width:46px;flex-shrink:0;background:var(--c-soft,#fffdf8);border:1.5px solid var(--c,rgba(0,0,0,0.14));border-radius:10px;color:var(--c,#b5790a);font-family:'Syne',sans-serif;font-weight:800;font-size:12px;text-align:center;text-transform:uppercase;outline:none}
.centre:focus{border-color:#b5790a}
.centre::placeholder{color:#c9bda4}
.btn{display:flex;flex:1;min-width:0;background:#fffdf8;border:1.5px solid rgba(0,0,0,0.10);border-left:4px solid var(--c,rgba(0,0,0,0.12));border-radius:12px;padding:14px 16px;text-decoration:none;color:#2b2a26;align-items:center;gap:12px;transition:all .15s}
.btn:hover{border-color:var(--c,#b5790a);background:var(--c-soft,rgba(181,121,10,0.10))}
.av{width:38px;height:38px;border-radius:50%;background:var(--c,#a2987f);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:12px;color:#fff;flex-shrink:0}
.cn{font-size:13px;color:#2b2a26;font-weight:500}
.cs{font-size:10px;color:#8a7f6b;margin-top:3px}
.cs.warn{color:#b5790a}
.cs.danger{color:#c0392b}
.cs.ok{color:#1e8e5a}
.loading{color:#8a7f6b;font-size:11px;text-align:center;padding:20px}
.err{color:#c0392b;font-size:11px;text-align:center;padding:20px}

  { name: "RAKOTONDRAVOAVY JONAH", slug: "rakotondravoavy-jonah" },
  { name: "POLLET THOMAS", slug: "pollet-thomas" },
  { name: "DELAMONNERAYE BAUDOUIN", slug: "delamonneraye-baudouin" },
];

// Sépare "NOM PRENOM" -> { prenom, nom } : le dernier mot est considéré
// comme le prénom (compatible avec les prénoms composés écrits avec un tiret).

// ══ COULEURS ══ une couleur stable par libellé (centre, motif…)
const COULEURS = ['#2d6cdf','#1e8e5a','#e0661a','#7b4fc9','#c0392b',
                 '#0f8e97','#c2417f','#5b8f0e','#8a5a2b','#2f7fb5'];
// Couleurs attribuées dans l'ordre alphabétique : deux libellés différents
// ne tombent jamais sur la même couleur (tant qu'il y en a 10 ou moins).
let CMAP = {};
function majCouleurs(libelles){
  const u=[...new Set((libelles||[]).map(x=>(x||'').trim().toUpperCase()).filter(Boolean))].sort();
  CMAP={}; u.forEach((t,i)=>{ CMAP[t]=COULEURS[i%COULEURS.length]; });
}
function couleurDe(txt){
  const t=(txt||'').trim().toUpperCase();
  if(!t) return '';
  if(CMAP[t]) return CMAP[t];
  let h=0; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))>>>0;
  return COULEURS[h%COULEURS.length];
}

function colorierRow(row){
  const inp=row.querySelector('.centre');
  const c=couleurDe(inp?inp.value:'');
  if(c){ row.style.setProperty('--c',c); row.style.setProperty('--c-soft',c+'22'); }
  else { row.style.removeProperty('--c'); row.style.removeProperty('--c-soft'); }
}
function colorierTout(){
  const rows=[...document.querySelectorAll('.row')];
  majCouleurs(rows.map(r=>{ const i=r.querySelector('.centre'); return i?i.value:''; }));
  rows.forEach(colorierRow);
}

function firstLast(name) {
  const parts = name.trim().split(/\s+/);
  const prenom = parts[parts.length - 1];
  const nom = parts.slice(0, -1).join(' ');
  return { prenom, nom };
}

function titleCaseWord(w) {
  return w.split('-').map(s => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase()).join('-');
}
function titleCase(str) {
  return str.split(' ').map(titleCaseWord).join(' ');
}

function initials(name) {
  const { prenom, nom } = firstLast(name);
  const nomFirst = nom.split(' ')[0] || '';
  return ((prenom[0] || '') + (nomFirst[0] || '')).toUpperCase();
}

function userKey(n) { return n.replace(/[^a-zA-Z0-9]/g, '_'); }

let CENTRES = {};

function renderList(compagnons) {
  const list = document.getElementById('list');
  if (!compagnons || compagnons.length === 0) {
    list.innerHTML = '<div class="err">Aucun compagnon enregistré</div>';
    return;
  }
  const sorted = compagnons.slice().sort((a, b) => {
    const pa = firstLast(a.name).prenom, pb = firstLast(b.name).prenom;
    return pa.localeCompare(pb, 'fr');
  });
  list.innerHTML = sorted.map(c => {
    const { prenom, nom } = firstLast(c.name);
    const centre = CENTRES[c.slug] || '';
    return `
  <div class="row" data-slug="${c.slug}" data-centre="${centre}">
    <input class="centre" maxlength="4" placeholder="—" value="${centre}" oninput="onCentreInput(this,'${c.slug}')" onchange="onCentreChange(this,'${c.slug}')">
    <a class="btn" href="${c.slug}.html">
      <div class="av">${initials(c.name)}</div>
      <div><div class="cn">${titleCase(prenom)} ${titleCase(nom)}</div><div class="cs" id="cs-${c.slug}">…</div></div>
    </a>
  </div>`;
  }).join('');
  colorierTout();
}

function onCentreInput(input, slug) {
  const val = input.value.toUpperCase();
  if (input.value !== val) input.value = val;
  const row = input.closest('.row');
  row.dataset.centre = val;
  CENTRES[slug] = val;
  colorierTout();
  refreshCentreFilterOptions();
  applyFilter();
}

function onCentreChange(input, slug) {
  const val = input.value.trim().toUpperCase();
  if (db) {
    db.ref('config/centres/' + slug).set(val).catch(() => {});
  }
}

function refreshCentreFilterOptions() {
  const sel = document.getElementById('centreFilter');
  if (!sel) return;
  const current = sel.value;
  const values = Array.from(new Set(Object.values(CENTRES).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'fr'));
  sel.innerHTML = '<option value="">Tous</option>' + values.map(v => `<option value="${v}">${v}</option>`).join('');
  if (values.includes(current)) sel.value = current;
}

function applyFilter() {
  const sel = document.getElementById('centreFilter');
  const val = sel ? sel.value : '';
  document.querySelectorAll('.row').forEach(row => {
    const show = !val || row.dataset.centre === val;
    row.classList.toggle('filtered-out', !show);
  });
  colorierTout();
}


// ── JOURS FÉRIÉS (France) — calculés automatiquement, comme dans les feuilles compagnons ──
function paquesDate(year){
  const a=year%19,b=Math.floor(year/100),c=year%100;
  const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(year,month-1,day);
}
function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function feriesFR(year){
  const set=new Set([
    `${year}-01-01`,`${year}-05-01`,`${year}-05-08`,`${year}-07-14`,
    `${year}-08-15`,`${year}-11-01`,`${year}-11-11`,`${year}-12-25`
  ]);
  const p=paquesDate(year);
  const lp=new Date(p);lp.setDate(p.getDate()+1);
  const asc=new Date(p);asc.setDate(p.getDate()+39);
  const lpe=new Date(p);lpe.setDate(p.getDate()+50);
  set.add(isoDate(lp));set.add(isoDate(asc));set.add(isoDate(lpe));
  return set;
}
function isFerieDate(iso){return feriesFR(parseInt(iso.slice(0,4),10)).has(iso);}

// Calcule le nombre de matins/après-midis non saisis ce mois-ci
// (jours ouvrés du 1er à aujourd'hui, hors jours fériés déclarés _FERIE)
function missingCounts(saisies) {
  const now = new Date();
  let manqueMatin = 0, manqueApm = 0;
  for (let d = 1; d <= now.getDate(); d++) {
    const date = new Date(now.getFullYear(), now.getMonth(), d);
    const jourIdx = date.getDay();
    if (jourIdx === 0 || jourIdx === 6) continue;
    const iso = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if (isFerieDate(iso)) continue;
    const s = saisies[iso];
    const ferieMatin = s && s.matin === '_FERIE';
    const ferieApm = s && s.apm === '_FERIE';
    if (!ferieMatin && (!s || !s.matin)) manqueMatin++;
    if (!ferieApm && (!s || !s.apm)) manqueApm++;
  }
  return { manqueMatin, manqueApm };
}

let db;

async function loadMissing(c) {
  const el = document.getElementById('cs-' + c.slug);
  if (!el || !db) return;
  try {
    const snap = await db.ref('saisies/' + userKey(c.name)).once('value');
    const saisies = snap.exists() ? snap.val() : {};
    const { manqueMatin, manqueApm } = missingCounts(saisies);
    const total = manqueMatin + manqueApm;
    if (total === 0) {
      el.textContent = '✓ à jour';
      el.className = 'cs ok';
    } else {
      const parts = [];
      if (manqueMatin > 0) parts.push(manqueMatin + ' matin' + (manqueMatin > 1 ? 's' : ''));
      if (manqueApm > 0) parts.push(manqueApm + ' après-midi' + (manqueApm > 1 ? 's' : ''));
      el.textContent = parts.join(' · ') + ' à compléter';
      el.className = 'cs ' + (total > 10 ? 'danger' : 'warn');
    }
  } catch (e) {
    el.textContent = '';
  }
}

async function initFirebase() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
  } catch (e) {
    return;
  }
  try {
    const snap = await db.ref('config/centres').once('value');
    if (snap.exists()) CENTRES = snap.val() || {};
  } catch (e) {}
  renderList(COMPAGNONS);
  refreshCentreFilterOptions();
  COMPAGNONS.forEach(loadMissing);
}

renderList(COMPAGNONS);
initFirebase();
</script>
